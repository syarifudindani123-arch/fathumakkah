/**
 * ============================================================================
 * WEB AUDIO API SOUND ENGINE (Tanpa file audio eksternal)
 * ============================================================================
 */
const SoundFX = {
    ctx: null,
    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    },
    playTap() {
        try {
            this.init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(780, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.09);
        } catch (e) {}
    },
    playCrumble() {
        try {
            this.init();
            if (!this.ctx) return;
            // Low rumble + noise burst for toppling idol
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(42, this.ctx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.38);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.38);
        } catch (e) {}
    },
    playSuccess() {
        try {
            this.init();
            if (!this.ctx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
            notes.forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.08 + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime + i * 0.08);
                osc.stop(this.ctx.currentTime + i * 0.08 + 0.25);
            });
        } catch (e) {}
    },
    playError() {
        try {
            this.init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(150, this.ctx.currentTime + 0.22);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.24);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.24);
        } catch (e) {}
    }
};

function navigateTo(screenName, extra = {}) {
    SoundFX.playTap();
    Object.assign(state, extra);
    state.screen = screenName;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showModal(htmlContent) {
    SoundFX.playTap();
    const overlay = document.getElementById('modal-overlay');

    overlay.classList.add('flex');

function toggleChapterVideo() {
    const vid = document.getElementById('chapter-video');
    if (!vid) return;
    SoundFX.playTap();
    if (vid.paused) {
        vid.play().catch(() => {});
    } else {
        vid.pause();
    }
}

function restartChapterVideo() {
    const vid = document.getElementById('chapter-video');
    if (!vid) return;
    SoundFX.playTap();
    vid.currentTime = 0;
    vid.play().catch(() => {});
}

function updateVideoBtnState(isPlaying) {
    const icon = document.getElementById('play-icon');

function destroyIdol(idx) {
    if (state.idolsDestroyed[idx]) return;
    SoundFX.playCrumble();
    state.idolsDestroyed[idx] = true;

    if (state.idolsDestroyed.every(Boolean)) {
        state.missionCompleted = true;
        saveProgress();
        setTimeout(() => SoundFX.playSuccess(), 250);
    }
    render();
}

function resetMissionIdols() {
    state.idolsDestroyed = [false, false, false, false];
    render();
}

/**
 * ============================================================================
 * 5. MINI QUIZ (5 PERTANYAAN PILIHAN GANDA INTERAKTIF)
 * ============================================================================
 */
function renderQuizScreen() {
    const qIdx = state.quizIndex;
    const total = QUIZ_DATA.length;

    // Tampilan Ringkasan Kuis Selesai
    if (state.quizCompleted && qIdx >= total) {
        return `
        ${getHeaderHTML('Hasil Mini Quiz', 'Evaluasi Pemahaman', true, 'map')}
        <main class="flex-1 p-5 flex flex-col justify-center items-center text-center space-y-5 animate-pop">
            <div class="bg-white rounded-3xl p-6 shadow-2xl border-b-4 border-ghazi-gold w-full">
                <div class="w-20 h-20 mx-auto rounded-full bg-amber-100 flex items-center justify-center text-4xl mb-3 shadow-inner">
                    🏆
                </div>
                <span class="px-3 py-1 rounded-full bg-purple-100 text-ghazi-dark text-xs font-extrabold uppercase">
                    Kuis Selesai
                </span>
                <h2 class="font-display font-bold text-2xl text-ghazi-dark mt-2">Skor Kamu</h2>
                <div class="font-display font-bold text-5xl text-ghazi-orange my-2">
                    ${state.quizScore}<span class="text-xl text-slate-400">/100</span>
                </div>
                <p class="text-slate-600 text-sm leading-relaxed">
                    ${state.quizScore >= 80
                        ? 'MasyaAllah! Pemahamanmu tentang sejarah Fathu Makkah sangat luar biasa!'
                        : 'Bagus! Kamu bisa mengulang kuis kapan saja untuk meraih nilai sempurna.'}
                </p>

                <div class="mt-6 space-y-2.5">
                    <button onclick="navigateTo('hikmah')" class="w-full py-3.5 rounded-2xl btn-3d-gold text-ghazi-dark font-display font-bold text-base">
                        LANJUT KE HIKMAH INTERAKTIF 💎
                    </button>
                    <button onclick="restartQuiz()" class="w-full py-3 rounded-2xl bg-ghazi-soft text-ghazi-dark font-display font-bold text-sm">
                        ↺ Ulangi Mini Quiz
                    </button>
                </div>
            </div>
        </main>`;
    }

    const q = QUIZ_DATA[qIdx];
    const letters = ['A', 'B', 'C', 'D'];

    return `
    ${getHeaderHTML('Mini Quiz Fathu Makkah', `Soal ${qIdx + 1} dari ${total}`, true, 'map')}

    <main class="flex-1 p-4 pb-8 flex flex-col justify-between space-y-4 animate-slide-up">
        <!-- Info Skor & Progress Soal -->
        <div class="flex items-center justify-between bg-white/15 px-4 py-2.5 rounded-2xl border border-white/15">
            <div class="flex items-center gap-1.5">
                ${QUIZ_DATA.map((_, i) => `
                    <span class="h-2.5 rounded-full transition-all ${i === qIdx ? 'w-6 bg-ghazi-gold' : i < qIdx ? 'w-2.5 bg-emerald-400' : 'w-2.5 bg-white/30'}"></span>
                `).join('')}
            </div>
            <div class="text-xs font-extrabold text-ghazi-gold">
                Skor: ${state.quizScore}
            </div>
        </div>

        <!-- Kartu Pertanyaan -->
        <div class="bg-white rounded-3xl p-5 shadow-xl border-b-4 border-purple-200">
            <span class="inline-block px-3 py-1 rounded-full bg-ghazi-soft text-ghazi-dark text-xs font-extrabold mb-2">
                Pertanyaan #${qIdx + 1}
            </span>
            <h2 class="font-display font-bold text-lg sm:text-xl text-slate-800 leading-snug">
                ${q.question}
            </h2>

            <!-- 4 Pilihan Jawaban -->
            <div class="mt-4 space-y-2.5">
                ${q.options.map((opt, oIdx) => {
                    let btnStyle = 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-ghazi-soft';
                    let badgeStyle = 'bg-white text-ghazi-dark border border-slate-200';
                    let animClass = '';

                    if (state.quizAnswered) {
                        if (oIdx === q.correct) {
                            btnStyle = 'bg-emerald-50 border-emerald-500 text-emerald-900 font-bold';
                            badgeStyle = 'bg-emerald-500 text-white border-emerald-500';
                            if (state.selectedOption === oIdx) animClass = 'animate-pop';
                        } else if (oIdx === state.selectedOption) {
                            btnStyle = 'bg-rose-50 border-rose-500 text-rose-900';
                            badgeStyle = 'bg-rose-500 text-white border-rose-500';
                            animClass = 'animate-shake';
                        } else {
                            btnStyle = 'bg-slate-50 border-slate-100 text-slate-400 opacity-60';
                        }
                    }

                    return `
                    <button onclick="answerQuiz(${oIdx})" ${state.quizAnswered ? 'disabled' : ''}
                        class="w-full p-3.5 rounded-2xl border-2 text-left flex items-center gap-3 transition ${btnStyle} ${animClass}">
                        <span class="w-8 h-8 rounded-xl flex items-center justify-center font-display font-bold text-sm shrink-0 ${badgeStyle}">
                            ${letters[oIdx]}
                        </span>
                        <span class="text-sm font-semibold leading-snug flex-1">${opt}</span>
                        ${state.quizAnswered && oIdx === q.correct ? '<span class="text-lg">✅</span>' : ''}
                        ${state.quizAnswered && oIdx === state.selectedOption && oIdx !== q.correct ? '<span class="text-lg">❌</span>' : ''}
                    </button>`;
                }).join('')}
            </div>

            <!-- Feedback Jawaban -->
            ${state.quizAnswered ? `
                <div class="mt-4 p-3.5 rounded-2xl ${state.selectedOption === q.correct ? 'bg-emerald-100/80 text-emerald-900' : 'bg-amber-100/80 text-amber-900'} text-xs sm:text-sm animate-pop">
                    <div class="font-extrabold mb-0.5">
                        ${state.selectedOption === q.correct ? '🎉 Jawaban Benar! (+20 Poin)' : '💡 Kurang Tepat, Yuk Pelajari:'}
                    </div>
                    <p>${q.explanation}</p>
                </div>
            ` : ''}
        </div>

        <!-- Tombol Lanjut Soal -->
        <div>
            ${state.quizAnswered ? `
                <button onclick="nextQuizQuestion()" class="w-full py-4 rounded-3xl btn-3d-gold text-ghazi-dark font-display font-bold text-base">
                    ${qIdx + 1 < total ? 'SOAL BERIKUTNYA ▶' : 'LIHAT SKOR AKHIR 🏆'}
                </button>
            ` : `
                <div class="text-center text-xs text-purple-200 font-semibold">
                    Pilih salah satu jawaban di atas
                </div>
            `}
        </div>
    </main>`;
}

function answerQuiz(optionIdx) {
    if (state.quizAnswered) return;
    state.quizAnswered = true;
    state.selectedOption = optionIdx;

    const currentQ = QUIZ_DATA[state.quizIndex];
    if (optionIdx === currentQ.correct) {
        state.quizScore += 20;
        SoundFX.playSuccess();
    } else {
        SoundFX.playError();
    }
    render();
}

function nextQuizQuestion() {
    SoundFX.playTap();
    state.quizIndex += 1;
    state.quizAnswered = false;
    state.selectedOption = null;

    if (state.quizIndex >= QUIZ_DATA.length) {
        state.quizCompleted = true;
        saveProgress();
    }
    render();
}

function restartQuiz() {
    SoundFX.playTap();
    state.quizIndex = 0;
    state.quizScore = 0;
    state.quizAnswered = false;
    state.selectedOption = null;
    state.quizCompleted = false;
    render();
}

                    <span class="mt-1 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full ${isFound ? 'bg-emerald-100 text-emerald-700' : 'bg-purple-100 text-purple-700'}">
                        ${isFound ? '✓ Terbuka' : 'Ketuk Ikon'}

                </button>`;
            }).join('')}

        ${selectedCard ? `

        <!-- Reward Jika Semua 4 Hikmah Berhasil Ditemukan -->
        ${allFound ? `

                <span class="text-3xl">🌟</span>
                <div class="flex-1">
                    <div class="font-display font-bold text-sm">Lencana Penjelajah Hikmah Diraih!</div>
                    <div class="text-xs font-semibold opacity-90">Semua nilai teladan Fathu Makkah telah ditemukan.</div>

            <button onclick="navigateTo('complete')" class="w-full py-4 rounded-3xl btn-3d-gold text-ghazi-dark font-display font-bold text-base">

function selectHikmah(id) {
    state.activeHikmah = id;
    if (!state.discoveredHikmah.includes(id)) {
        state.discoveredHikmah.push(id);
        saveProgress();
        if (state.discoveredHikmah.length === HIKMAH_DATA.length) {
            SoundFX.playSuccess();
        } else {
            SoundFX.playTap();
        }
    } else {
        SoundFX.playTap();
    }
    render();
}

            </p>

            <!-- Ringkasan Skor & Progres -->
            <div class="grid grid-cols-2 gap-2.5 mt-4">
                <div class="bg-ghazi-soft rounded-2xl p-3">
                    <div class="text-[11px] font-bold text-purple-700">Skor Mini Quiz</div>
                    <div class="font-display font-bold text-2xl text-ghazi-dark">${state.quizScore}<span class="text-xs">/100</span></div>
                </div>
                <div class="bg-amber-50 rounded-2xl p-3">
                    <div class="text-[11px] font-bold text-amber-800">Titik Cerita</div>
                    <div class="font-display font-bold text-2xl text-ghazi-orange">${state.completedChapters.length}<span class="text-xs">/10</span></div>
                </div>
            </div>

            <!-- Hikmah yang Ditemukan -->
            <div class="mt-4 text-left bg-slate-50 rounded-2xl p-3.5 border border-slate-100">
                <div class="text-xs font-extrabold text-slate-600 mb-2">
                    💎 Hikmah yang Ditemukan (${state.discoveredHikmah.length}/4):
                </div>
                <div class="flex flex-wrap gap-1.5">
                    ${HIKMAH_DATA.map(h => {
                        const found = state.discoveredHikmah.includes(h.id);
                        return `
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1
                            ${found ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-500'}">
                            <span>${h.icon}</span>
                            <span>${h.title}</span>
                        </span>`;
                    }).join('')}
                </div>
            </div>
        </div>

        <!-- Tombol Aksi Akhir -->
        <div class="w-full space-y-2.5 pb-3">
            <button onclick="resetAllJourney()" class="w-full py-4 rounded-3xl btn-3d-gold text-ghazi-dark font-display font-bold text-base tracking-wide">
                ↺ ULANGI PERJALANAN
            </button>

            <button onclick="exitToMyGhazi()" class="w-full py-3.5 rounded-3xl bg-white/15 hover:bg-white/25 border border-white/25 text-white font-display font-bold text-sm tracking-wide transition">
                🏠 KEMBALI KE MYGHAZI
            </button>
        </div>
    </div>`;
}

function resetAllJourney() {
    SoundFX.playTap();
    state.currentChapterIndex = 0;
    state.completedChapters = [];
    state.missionCompleted = false;
    state.idolsDestroyed = [false, false, false, false];
    state.quizIndex = 0;
    state.quizScore = 0;
    state.quizAnswered = false;
    state.selectedOption = null;
    state.quizCompleted = false;
    state.discoveredHikmah = [];
    state.activeHikmah = null;
    saveProgress();
    navigateTo('splash');
}

/**
 * Integrasi Kodular WebViewer:
 * Mengirim sinyal string ke Kodular WebViewString jika dibuka di dalam Android App,
 * sekaligus menampilkan kartu konfirmasi ramah pengguna.
 */
function exitToMyGhazi() {
    SoundFX.playSuccess();
    try {
        // Kirim sinyal ke Kodular WebViewer jika aplikasi berjalan di dalam Android WebView
        if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
            window.AppInventor.setWebViewString("CLOSE_FATHU_MAKKAH");
        }
    } catch (e) {}

    showModal(`
        <div class="text-center">
            <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-purple-100 flex items-center justify-center text-3xl">
                📱
            </div>
            <h3 class="font-display font-bold text-xl text-ghazi-dark mb-1">Kembali ke Aplikasi MyGhazi</h3>
            <p class="text-slate-600 text-sm leading-relaxed mb-4">
                Sinyal kembali telah dikirim ke aplikasi <strong>MyGhazi</strong> di Kodular. Jika di browser, gunakan tombol di bawah ini.
            </p>
            <div class="space-y-2">
                <button onclick="closeModal(); navigateTo('splash');" class="w-full py-3 rounded-2xl btn-3d-purple text-white font-display font-bold text-sm">
                    Ke Halaman Pembuka
                </button>
                <button onclick="closeModal()" class="w-full py-2.5 rounded-2xl bg-slate-100 text-slate-600 font-bold text-xs">
                    Tetap di Halaman Ini
                </button>
            </div>
        </div>
    `);
}

/**
 * ============================================================================
 * RENDER UTAMA
 * ============================================================================
 */
function render() {
    const app = document.getElementById('app');
    switch (state.screen) {
        case 'splash':
            app.innerHTML = renderSplashScreen();
            break;
        case 'map':
            app.innerHTML = renderMapScreen();
            break;
        case 'chapter':
            app.innerHTML = renderChapterScreen();
            break;
        case 'mission':
            app.innerHTML = renderMissionScreen();
            break;
        case 'quiz':
            app.innerHTML = renderQuizScreen();
            break;
        case 'hikmah':
            app.innerHTML = renderHikmahScreen();
            break;
        case 'complete':
            app.innerHTML = renderCompleteScreen();
            break;
        default:
            app.innerHTML = renderSplashScreen();
    }
}

// Inisialisasi aplikasi saat halaman dimuat
window.addEventListener('DOMContentLoaded', () => {
    render();
});
</script>
</body>
</html>
